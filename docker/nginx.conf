worker_processes auto;
worker_shutdown_timeout 10s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 64k;
    keepalive_timeout 30s;

    # ---------------------------------------------------------------------
    # Forwarded scheme and client address
    #
    # This container is reached over plain HTTP from the host Nginx, which
    # sits behind the AIC Cloud TLS edge. $scheme here is therefore ALWAYS
    # "http" and must never be used to build the request origin: doing so
    # makes the API compute an http:// origin while the browser sent
    # https://, and every admin mutation is then rejected with 403.
    #
    # The upstream edge is the only component that knows the public scheme
    # and the real client address, so those values are carried forward and
    # strictly validated here.
    # ---------------------------------------------------------------------

    # Only the literal token "https" is honoured. nginx map keys match
    # case-insensitively, which is correct for a URI scheme. Any other value
    # (absent, empty, "http", or a forged token) degrades to "http" so a
    # malformed header can never select the scheme.
    map $http_x_forwarded_proto $rz_forwarded_proto {
        default http;
        https   https;
    }

    # The upstream sends the real client address as a single value. A chained
    # or malformed value is not trusted: the socket peer is used instead,
    # which is the host Nginx address rather than a spoofable one.
    map $http_x_forwarded_for $rz_forwarded_for {
        default                 $remote_addr;
        "~^[0-9a-fA-F:.]+$"     $http_x_forwarded_for;
    }

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        location = /healthz {
            include /etc/nginx/security-headers.conf;
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /api { return 308 /api/; }
        location ^~ /api/ {
            # Both apps join the stable namespace. Keep the exact Express trust allowlist.
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            # Carry the real client identity and the public scheme, both validated above.
            proxy_set_header X-Forwarded-For $rz_forwarded_for;
            proxy_set_header X-Real-IP $rz_forwarded_for;
            proxy_set_header X-Forwarded-Proto $rz_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            # API supplies its own security headers/CSP. Do not replace them with frontend policy.
        }
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }
        location ^~ /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location ~ /\. {
            include /etc/nginx/security-headers.conf;
            deny all;
        }
        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
