worker_processes auto;
worker_shutdown_timeout 10s;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 64k;
    keepalive_timeout 30s;
    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        location = /healthz {
            include /etc/nginx/security-headers.conf;
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /api { return 308 /api/; }
        location ^~ /api/ {
            # Both apps join the stable namespace. Keep the exact Express trust allowlist.
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            # Replace client-supplied forwarding headers; do not append spoofable chains.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            # API supplies its own security headers/CSP. Do not replace them with frontend policy.
        }
        location = /index.html {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
        }
        location ^~ /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location ~ /\. {
            include /etc/nginx/security-headers.conf;
            deny all;
        }
        location / {
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
