# RZ Fixer - production host reverse proxy.
#
# Installed by scripts/deploy/deploy.sh at /etc/nginx/sites-available/rz-care.
# The AIC Cloud TLS edge terminates HTTPS and forwards to this host over plain
# HTTP on port 80, so this file is the only public ingress.
#
# TLS, certificates and the HTTPS redirect for the apex host are owned by the
# edge. This file only forwards to the Docker Compose frontend container.

# The edge is the only component that knows the real client address. Trust
# forwarded client addresses only from the AIC Cloud private network; a
# request from anywhere else keeps its real socket peer.
set_real_ip_from 10.10.10.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Only the literal token "https" is honoured. The edge sets this to the
# scheme the visitor actually used.
map $http_x_forwarded_proto $rz_public_proto {
    default http;
    https   https;
}

server {
    listen 80;
    listen [::]:80;

    server_name rzfixer.in;

    client_max_body_size 64k;

    location / {
        # Frontend container (Docker Compose, loopback-bound on the host).
        proxy_pass http://127.0.0.1:${WEB_PORT:-8080};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # The container Nginx validates and forwards both of these to the API.
        proxy_set_header X-Forwarded-Proto $rz_public_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name www.rzfixer.in;

    # Canonical domain. 308 is used rather than 301 so the request method and
    # body are preserved for API calls that arrive at the www host.
    return 308 https://rzfixer.in$request_uri;
}
