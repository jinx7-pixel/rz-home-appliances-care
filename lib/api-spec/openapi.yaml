openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: repair-requests
    description: Anonymous appliance repair request submissions
  - name: customer
    description: Guest review invitations and submissions
  - name: admin
    description: Administrator authentication, repair request management, and review moderation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /repair-requests:
    post:
      operationId: createRepairRequest
      tags: [repair-requests]
      summary: Submit a repair request
      description: Stores a guest repair request and records notification email delivery status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairRequestInput"
      responses:
        "201":
          description: Repair request saved; notification delivery is recorded separately
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRequestSubmission"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Database or server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customer/review-target:
    get:
      operationId: getCustomerReviewTarget
      tags: [customer]
      summary: Load one completed customer request or booking for review
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
        - name: requestId
          in: query
          required: false
          schema:
            type: string
        - name: bookingId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Review target and any existing review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerReviewTarget"
        "400":
          description: Exactly one request or booking identifier is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Completed customer work not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customer/reviews:
    post:
      operationId: createCustomerReview
      tags: [customer]
      summary: Submit a review for a completed customer service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerReviewInput"
      responses:
        "201":
          description: Review submitted for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerReview"
        "400":
          description: Invalid review data or incomplete work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A review already exists for this work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /reviews:
    get:
      operationId: getPublicReviews
      tags: [reviews]
      summary: List approved public customer reviews
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 3
            maximum: 100
            default: 6
      responses:
        "200":
          description: Approved reviews safe for public display
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicReview"
  /admin/auth/login:
    post:
      operationId: adminAuthLogin
      tags: [admin]
      summary: Sign in an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Administrator signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "400":
          description: Invalid login details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/auth/logout:
    post:
      operationId: adminAuthLogout
      tags: [admin]
      summary: Sign out an administrator
      responses:
        "200":
          description: Administrator signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMessageResult"
  /admin/auth/me:
    get:
      operationId: adminAuthMe
      tags: [admin]
      summary: Get the current administrator session
      responses:
        "200":
          description: Administrator authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeResult"
  /admin/repair-requests:
    get:
      operationId: getAdminRepairRequests
      tags: [admin]
      summary: List all contact and repair requests
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AdminRequestStatus"
        - name: customerType
          in: query
          required: false
          schema:
            type: string
            enum: [guest, registered]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        "200":
          description: All contact and repair requests visible to administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRepairRequest"
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/repair-requests/{requestId}:
    get:
      operationId: getAdminRepairRequest
      tags: [admin]
      summary: View a complete repair request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete repair request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRepairRequest"
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Repair request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAdminRepairRequest
      tags: [admin]
      summary: Update a repair request status or internal notes
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRepairRequestUpdate"
      responses:
        "200":
          description: Repair request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRepairRequest"
        "400":
          description: Invalid update data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Repair request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/reviews:
    get:
      operationId: getAdminReviews
      tags: [admin]
      summary: List customer reviews for moderation
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: rating
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ReviewStatus"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        "200":
          description: Reviews visible to administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminReview"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/reviews/{reviewId}:
    get:
      operationId: getAdminReview
      tags: [admin]
      summary: View a customer review and related work
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReview"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAdminReview
      tags: [admin]
      summary: Moderate a customer review or update internal notes
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReviewUpdate"
      responses:
        "200":
          description: Review updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReview"
        "400":
          description: Invalid review update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminReview
      tags: [admin]
      summary: Delete a customer review
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Review deleted
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RepairRequestInput:
      type: object
      additionalProperties: false
      required:
        - customerName
        - phone
        - email
        - applianceType
        - problemDescription
        - address
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: "^[0-9]{10}$"
        email:
          type: string
          format: email
          maxLength: 254
        applianceType:
          type: string
          enum:
            - Washing Machine Repair
            - Refrigerator Repair
            - Micro Oven Repair
            - LED TV Repair
        problemDescription:
          type: string
          minLength: 10
          maxLength: 2000
        address:
          type: string
          minLength: 10
          maxLength: 500
        preferredDate:
          type: ["string", "null"]
          format: date
        preferredTime:
          type: ["string", "null"]
          maxLength: 100
    RepairRequestSubmission:
      type: object
      required:
        - success
        - requestId
        - message
      properties:
        success:
          type: boolean
        requestId:
          type: string
        message:
          type: string
    ReviewStatus:
      type: string
      enum: [pending, approved, rejected, hidden]
    CustomerReviewTarget:
      type: object
      required:
        - sourceType
        - sourceId
        - applianceType
        - status
        - existingReview
      properties:
        sourceType:
          type: string
          enum: [repair_request, booking]
        sourceId:
          type: string
        applianceType:
          type: string
        status:
          type: string
        existingReview:
          anyOf:
            - $ref: "#/components/schemas/CustomerReview"
            - type: "null"
    CustomerReviewInput:
      type: object
      additionalProperties: false
      required:
        - rating
        - reviewMessage
        - showFirstName
      properties:
        requestId:
          type: ["string", "null"]
        bookingId:
          type: ["string", "null"]
        token:
          type: ["string", "null"]
          minLength: 32
          maxLength: 128
        rating:
          type: integer
          minimum: 1
          maximum: 5
        reviewMessage:
          type: string
          minLength: 10
          maxLength: 1000
        showFirstName:
          type: boolean
    CustomerReview:
      type: object
      required:
        - reviewId
        - sourceType
        - sourceId
        - applianceType
        - relatedStatus
        - relatedDate
        - relatedTime
        - relatedAddress
        - relatedProblemDescription
        - rating
        - reviewMessage
        - showFirstName
        - isVerified
        - status
        - createdAt
      properties:
        reviewId:
          type: string
        sourceType:
          type: string
          enum: [repair_request, booking]
        sourceId:
          type: string
        applianceType:
          type: string
        relatedStatus:
          type: string
        relatedDate:
          type: ["string", "null"]
          format: date
        relatedTime:
          type: ["string", "null"]
        relatedAddress:
          type: ["string", "null"]
        relatedProblemDescription:
          type: ["string", "null"]
        rating:
          type: integer
        reviewMessage:
          type: string
        showFirstName:
          type: boolean
        isVerified:
          type: boolean
        status:
          $ref: "#/components/schemas/ReviewStatus"
        createdAt:
          type: string
          format: date-time
    PublicReview:
      type: object
      required:
        - reviewId
        - rating
        - reviewMessage
        - customerLabel
        - applianceType
        - isVerified
        - createdAt
      properties:
        reviewId:
          type: string
        rating:
          type: integer
        reviewMessage:
          type: string
        customerLabel:
          type: string
        applianceType:
          type: ["string", "null"]
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    AdminMessageResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    AdminLoginInput:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    AdminUser:
      type: object
      required:
        - id
        - username
        - displayName
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
    AdminLoginResult:
      type: object
      required:
        - admin
      properties:
        admin:
          $ref: "#/components/schemas/AdminUser"
    AdminMeResult:
      type: object
      required:
        - authenticated
        - admin
      properties:
        authenticated:
          type: boolean
        admin:
          anyOf:
            - $ref: "#/components/schemas/AdminUser"
            - type: "null"
    AdminRequestStatus:
      type: string
      enum:
        - pending
        - contacted
        - in_progress
        - completed
        - cancelled
    AdminRepairRequest:
      type: object
      required:
        - requestId
        - customerName
        - email
        - phone
        - applianceType
        - problemDescription
        - address
        - customerId
        - customerType
        - preferredDate
        - preferredTime
        - status
        - adminNotes
        - cancellationReason
        - emailStatus
        - createdAt
        - updatedAt
      properties:
        requestId:
          type: string
        customerName:
          type: string
        email:
          type: string
        phone:
          type: string
        applianceType:
          type: string
        problemDescription:
          type: string
        address:
          type: string
        customerId:
          type: ["string", "null"]
          format: uuid
        customerType:
          type: string
          enum: [guest, registered]
        preferredDate:
          type: ["string", "null"]
          format: date
        preferredTime:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AdminRequestStatus"
        adminNotes:
          type: ["string", "null"]
        cancellationReason:
          type: ["string", "null"]
        emailStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminRepairRequestUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/AdminRequestStatus"
        adminNotes:
          type: ["string", "null"]
          maxLength: 5000
        cancellationReason:
          type: ["string", "null"]
          maxLength: 2000
    AdminReview:
      type: object
      required:
        - reviewId
        - customerName
        - customerEmail
        - sourceType
        - sourceId
        - applianceType
        - relatedStatus
        - relatedDate
        - relatedTime
        - relatedAddress
        - relatedProblemDescription
        - rating
        - reviewMessage
        - showFirstName
        - isVerified
        - status
        - adminNotes
        - createdAt
        - updatedAt
      properties:
        reviewId:
          type: string
        customerId:
          type: ["string", "null"]
          format: uuid
        customerName:
          type: string
        customerEmail:
          type: string
          format: email
        sourceType:
          type: string
          enum: [repair_request, booking]
        sourceId:
          type: string
        applianceType:
          type: string
        relatedStatus:
          type: string
        relatedDate:
          type: ["string", "null"]
          format: date
        relatedTime:
          type: ["string", "null"]
        relatedAddress:
          type: ["string", "null"]
        relatedProblemDescription:
          type: ["string", "null"]
        rating:
          type: integer
        reviewMessage:
          type: string
        showFirstName:
          type: boolean
        isVerified:
          type: boolean
        status:
          $ref: "#/components/schemas/ReviewStatus"
        adminNotes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminReviewUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/ReviewStatus"
        adminNotes:
          type: ["string", "null"]
          maxLength: 5000