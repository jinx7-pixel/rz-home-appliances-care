openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: repair-requests
    description: Anonymous appliance repair request submissions
  - name: auth
    description: Customer authentication
  - name: admin
    description: Administrator authentication, repair request, and booking management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /repair-requests:
    post:
      operationId: createRepairRequest
      tags: [repair-requests]
      summary: Submit a repair request
      description: Stores an anonymous repair request and sends business and customer email notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairRequestInput"
      responses:
        "201":
          description: Repair request accepted and both emails sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRequestSubmission"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Database or server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email delivery failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customer/repair-requests:
    get:
      operationId: getCustomerRepairRequests
      tags: [customer]
      summary: List the authenticated customer's repair requests
      responses:
        "200":
          description: Repair requests belonging to the authenticated customer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerRepairRequest"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customer/bookings:
    get:
      operationId: getCustomerBookings
      tags: [customer]
      summary: List the authenticated customer's bookings
      responses:
        "200":
          description: Bookings belonging to the authenticated customer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerBooking"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createCustomerBooking
      tags: [customer]
      summary: Create a booking for the authenticated customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerBookingInput"
      responses:
        "201":
          description: Booking accepted and both emails sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerBookingSubmission"
        "400":
          description: Invalid booking data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many booking requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Database or server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email delivery failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/signup:
    post:
      operationId: authSignup
      tags: [auth]
      summary: Create a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResult"
        "400":
          description: Invalid signup details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many signup attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Sign in a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResult"
        "400":
          description: Invalid login details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Sign out a customer
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResult"
  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [auth]
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthForgotPasswordInput"
      responses:
        "202":
          description: Generic password reset response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResult"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many reset attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [auth]
      summary: Set a new password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResult"
        "400":
          description: Invalid or expired reset request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many reset attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get the current authenticated customer
      responses:
        "200":
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResult"
  /admin/auth/login:
    post:
      operationId: adminAuthLogin
      tags: [admin]
      summary: Sign in an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Administrator signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResult"
        "400":
          description: Invalid login details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/auth/logout:
    post:
      operationId: adminAuthLogout
      tags: [admin]
      summary: Sign out an administrator
      responses:
        "200":
          description: Administrator signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResult"
  /admin/auth/me:
    get:
      operationId: adminAuthMe
      tags: [admin]
      summary: Get the current administrator session
      responses:
        "200":
          description: Administrator authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeResult"
  /admin/repair-requests:
    get:
      operationId: getAdminRepairRequests
      tags: [admin]
      summary: List all contact and repair requests
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AdminRequestStatus"
        - name: customerType
          in: query
          required: false
          schema:
            type: string
            enum: [guest, registered]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        "200":
          description: All contact and repair requests visible to administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminRepairRequest"
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/repair-requests/{requestId}:
    get:
      operationId: getAdminRepairRequest
      tags: [admin]
      summary: View a complete repair request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete repair request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRepairRequest"
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Repair request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAdminRepairRequest
      tags: [admin]
      summary: Update a repair request status or internal notes
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRepairRequestUpdate"
      responses:
        "200":
          description: Repair request updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRepairRequest"
        "400":
          description: Invalid update data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Repair request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/bookings:
    get:
      operationId: getAdminBookings
      tags: [admin]
      summary: List all customer bookings
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AdminBookingStatus"
        - name: customerType
          in: query
          required: false
          schema:
            type: string
            enum: [guest, registered]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        "200":
          description: All customer bookings visible to administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBooking"
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /admin/bookings/{bookingId}:
    get:
      operationId: getAdminBooking
      tags: [admin]
      summary: View a complete customer booking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBooking"
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateAdminBooking
      tags: [admin]
      summary: Update a booking status or internal notes
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBookingUpdate"
      responses:
        "200":
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBooking"
        "400":
          description: Invalid update data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Administrator authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RepairRequestInput:
      type: object
      additionalProperties: false
      required:
        - customerName
        - phone
        - email
        - applianceType
        - problemDescription
        - address
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: "^[0-9]{10}$"
        email:
          type: string
          format: email
          maxLength: 254
        applianceType:
          type: string
          enum:
            - Washing Machine Repair
            - Refrigerator Repair
            - Micro Oven Repair
            - LED TV Repair
        problemDescription:
          type: string
          minLength: 10
          maxLength: 2000
        address:
          type: string
          minLength: 10
          maxLength: 500
        preferredDate:
          type: ["string", "null"]
          format: date
        preferredTime:
          type: ["string", "null"]
          maxLength: 100
    RepairRequestSubmission:
      type: object
      required:
        - success
        - requestId
        - message
      properties:
        success:
          type: boolean
        requestId:
          type: string
        message:
          type: string
    CustomerRepairRequest:
      type: object
      required:
        - requestId
        - applianceType
        - problemDescription
        - preferredDate
        - preferredTime
        - status
        - createdAt
      properties:
        requestId:
          type: string
        applianceType:
          type: string
        problemDescription:
          type: string
        preferredDate:
          type: ["string", "null"]
          format: date
        preferredTime:
          type: ["string", "null"]
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    CustomerBookingInput:
      type: object
      additionalProperties: false
      required:
        - phone
        - applianceType
        - problemDescription
        - preferredDate
        - preferredTime
        - address
      properties:
        phone:
          type: string
          pattern: "^[0-9]{10}$"
        applianceType:
          type: string
          enum:
            - Washing Machine Repair
            - Refrigerator Repair
            - Micro Oven Repair
            - LED TV Repair
        problemDescription:
          type: string
          minLength: 10
          maxLength: 2000
        preferredDate:
          type: string
          format: date
        preferredTime:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 10
          maxLength: 500
        additionalNotes:
          type: ["string", "null"]
          maxLength: 2000
    CustomerBookingSubmission:
      type: object
      required:
        - success
        - bookingId
        - message
      properties:
        success:
          type: boolean
        bookingId:
          type: string
        message:
          type: string
    CustomerBooking:
      type: object
      required:
        - bookingId
        - applianceType
        - problemDescription
        - preferredDate
        - preferredTime
        - status
        - createdAt
        - address
        - additionalNotes
      properties:
        bookingId:
          type: string
        applianceType:
          type: string
        problemDescription:
          type: string
        preferredDate:
          type: string
          format: date
        preferredTime:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        address:
          type: string
        additionalNotes:
          type: ["string", "null"]
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    AuthUser:
      type: object
      required:
        - id
        - fullName
        - email
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
    AuthSignupInput:
      type: object
      additionalProperties: false
      required:
        - fullName
        - email
        - password
        - confirmPassword
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 128
    AuthLoginInput:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        rememberMe:
          type: boolean
          default: false
    AuthForgotPasswordInput:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    AuthResetPasswordInput:
      type: object
      additionalProperties: false
      required:
        - token
        - password
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
        password:
          type: string
          minLength: 8
          maxLength: 128
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 128
    AuthLoginResult:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthMeResult:
      type: object
      required:
        - authenticated
        - user
      properties:
        authenticated:
          type: boolean
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    AuthMessageResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    AdminLoginInput:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    AdminUser:
      type: object
      required:
        - id
        - username
        - displayName
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
    AdminLoginResult:
      type: object
      required:
        - admin
      properties:
        admin:
          $ref: "#/components/schemas/AdminUser"
    AdminMeResult:
      type: object
      required:
        - authenticated
        - admin
      properties:
        authenticated:
          type: boolean
        admin:
          anyOf:
            - $ref: "#/components/schemas/AdminUser"
            - type: "null"
    AdminRequestStatus:
      type: string
      enum:
        - pending
        - contacted
        - in_progress
        - completed
        - cancelled
    AdminRepairRequest:
      type: object
      required:
        - requestId
        - customerName
        - email
        - phone
        - applianceType
        - problemDescription
        - address
        - customerId
        - customerType
        - preferredDate
        - preferredTime
        - status
        - adminNotes
        - cancellationReason
        - emailStatus
        - createdAt
        - updatedAt
      properties:
        requestId:
          type: string
        customerName:
          type: string
        email:
          type: string
        phone:
          type: string
        applianceType:
          type: string
        problemDescription:
          type: string
        address:
          type: string
        customerId:
          type: ["string", "null"]
          format: uuid
        customerType:
          type: string
          enum: [guest, registered]
        preferredDate:
          type: ["string", "null"]
          format: date
        preferredTime:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AdminRequestStatus"
        adminNotes:
          type: ["string", "null"]
        cancellationReason:
          type: ["string", "null"]
        emailStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminRepairRequestUpdate:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/AdminRequestStatus"
        adminNotes:
          type: ["string", "null"]
          maxLength: 5000
        cancellationReason:
          type: ["string", "null"]
          maxLength: 2000
    AdminBookingStatus:
      type: string
      enum:
        - pending
        - contacted
        - confirmed
        - in_progress
        - completed
        - cancelled
    AdminBooking:
      type: object
      required:
        - bookingId
        - customerName
        - email
        - phone
        - customerId
        - customerType
        - applianceType
        - problemDescription
        - preferredDate
        - preferredTime
        - address
        - additionalNotes
        - status
        - adminNotes
        - cancellationReason
        - emailStatus
        - createdAt
        - updatedAt
      properties:
        bookingId:
          type: string
        customerName:
          type: string
        email:
          type: string
        phone:
          type: string
        customerId:
          type: ["string", "null"]
          format: uuid
        customerType:
          type: string
          enum: [guest, registered]
        applianceType:
          type: string
        problemDescription:
          type: string
        preferredDate:
          type: string
          format: date
        preferredTime:
          type: string
        address:
          type: string
        additionalNotes:
          type: ["string", "null"]
        status:
          $ref: "#/components/schemas/AdminBookingStatus"
        adminNotes:
          type: ["string", "null"]
        cancellationReason:
          type: ["string", "null"]
        emailStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
