openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: repair-requests
    description: Anonymous appliance repair request submissions
  - name: auth
    description: Customer authentication
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /repair-requests:
    post:
      operationId: createRepairRequest
      tags: [repair-requests]
      summary: Submit a repair request
      description: Stores an anonymous repair request and sends business and customer email notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairRequestInput"
      responses:
        "201":
          description: Repair request accepted and both emails sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairRequestSubmission"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Database or server failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email delivery failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/signup:
    post:
      operationId: authSignup
      tags: [auth]
      summary: Create a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResult"
        "400":
          description: Invalid signup details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many signup attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Sign in a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResult"
        "400":
          description: Invalid login details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Sign out a customer
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResult"
  /auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [auth]
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthForgotPasswordInput"
      responses:
        "202":
          description: Generic password reset response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResult"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many reset attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [auth]
      summary: Set a new password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessageResult"
        "400":
          description: Invalid or expired reset request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many reset attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get the current authenticated customer
      responses:
        "200":
          description: Authentication state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RepairRequestInput:
      type: object
      additionalProperties: false
      required:
        - customerName
        - phone
        - email
        - applianceType
        - problemDescription
        - address
      properties:
        customerName:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          pattern: "^[0-9]{10}$"
        email:
          type: string
          format: email
          maxLength: 254
        applianceType:
          type: string
          enum:
            - Washing Machine Repair
            - Refrigerator Repair
            - Micro Oven Repair
            - LED TV Repair
        problemDescription:
          type: string
          minLength: 10
          maxLength: 2000
        address:
          type: string
          minLength: 10
          maxLength: 500
        preferredDate:
          type: ["string", "null"]
          format: date
        preferredTime:
          type: ["string", "null"]
          maxLength: 100
    RepairRequestSubmission:
      type: object
      required:
        - success
        - requestId
        - message
      properties:
        success:
          type: boolean
        requestId:
          type: string
        message:
          type: string
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    AuthUser:
      type: object
      required:
        - id
        - fullName
        - email
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
    AuthSignupInput:
      type: object
      additionalProperties: false
      required:
        - fullName
        - email
        - password
        - confirmPassword
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 128
    AuthLoginInput:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        rememberMe:
          type: boolean
          default: false
    AuthForgotPasswordInput:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    AuthResetPasswordInput:
      type: object
      additionalProperties: false
      required:
        - token
        - password
        - confirmPassword
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
        password:
          type: string
          minLength: 8
          maxLength: 128
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 128
    AuthLoginResult:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthMeResult:
      type: object
      required:
        - authenticated
        - user
      properties:
        authenticated:
          type: boolean
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    AuthMessageResult:
      type: object
      required:
        - message
      properties:
        message:
          type: string