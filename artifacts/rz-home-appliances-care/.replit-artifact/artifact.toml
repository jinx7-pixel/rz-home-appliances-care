kind = "web"
previewPath = "/"
title = "RZ Fixer"
description = "RZ Fixer — customer-facing website for home appliance repair services in Bengaluru, with a public repair-request form and service, about and contact sections."
version = "1.0.0"
id = "artifacts/rz-home-appliances-care"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23672

[services.development]
run = "pnpm --filter @workspace/rz-home-appliances-care run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rz-home-appliances-care", "run", "build" ]
serve = "static"
publicDir = "artifacts/rz-home-appliances-care/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23672"
BASE_PATH = "/"
